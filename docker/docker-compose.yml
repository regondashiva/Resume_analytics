version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: resume_screening_mysql
    environment:
      MYSQL_ROOT_PASSWORD: Shiva@56
      MYSQL_DATABASE: resume_screening
      MYSQL_USER: recruit_user
      MYSQL_PASSWORD: recruit_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend FastAPI
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: resume_screening_backend
    environment:
      DATABASE_URL: mysql+pymysql://recruit_user:recruit_pass@mysql:3306/resume_screening
      SECRET_KEY: your-super-secret-key-change-in-production
      DEBUG: "False"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - ../uploads:/app/uploads
      - ../reports:/app/reports
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      timeout: 10s
      retries: 5

  # Frontend Next.js
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: resume_screening_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      timeout: 10s
      retries: 5

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
